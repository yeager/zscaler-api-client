name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon0
          pip install -r requirements.txt
      
      - name: Build
        run: |
          python scripts/compile_translations.py
          pyinstaller --noconfirm --name "ZS API Client" --add-data "translations:translations" --add-data "data:data" --add-data "assets:assets" --add-data "CHANGELOG.md:." --hidden-import keyring.backends.SecretService zscaler_api_client.py
          cd dist
          tar czf ZS-API-Client-linux-x64.tar.gz "ZS API Client"
          cd ..
          python scripts/generate_spdx_sbom.py --artifact dist/ZS-API-Client-linux-x64.tar.gz --output dist/ZS-API-Client-linux-x64.spdx.json

      - name: Attest Linux package and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/ZS-API-Client-linux-x64.tar.gz
          sbom-path: dist/ZS-API-Client-linux-x64.spdx.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            dist/ZS-API-Client-linux-x64.tar.gz
            dist/ZS-API-Client-linux-x64.spdx.json

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Build
        run: |
          python scripts/compile_translations.py
          pyinstaller --noconfirm --name "ZS API Client" --add-data "translations;translations" --add-data "data;data" --add-data "assets;assets" --add-data "CHANGELOG.md;." --hidden-import keyring.backends.Windows zscaler_api_client.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\ZS-API-Client.iss"

      - name: Generate Windows SBOM
        run: python scripts/generate_spdx_sbom.py --artifact dist/ZS-API-Client-windows-x64-setup.exe --output dist/ZS-API-Client-windows-x64-setup.spdx.json

      - name: Attest Windows package and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/ZS-API-Client-windows-x64-setup.exe
          sbom-path: dist/ZS-API-Client-windows-x64-setup.spdx.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/ZS-API-Client-windows-x64-setup.exe
            dist/ZS-API-Client-windows-x64-setup.spdx.json

  build-macos:
    name: macOS (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel
            runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
            artifact_suffix: intel-x64
          - label: Apple Silicon
            runner: macos-15
            architecture: arm64
            python_architecture: arm64
            artifact_suffix: arm64
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_architecture }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Build native macOS application
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          python scripts/compile_translations.py
          pyinstaller --noconfirm --windowed --name "ZS API Client" --osx-bundle-identifier com.yeager.zscaler-api-client --add-data "translations:translations" --add-data "data:data" --add-data "assets:assets" --add-data "CHANGELOG.md:." --hidden-import keyring.backends.macOS zscaler_api_client.py
          test "$(lipo -archs 'dist/ZS API Client.app/Contents/MacOS/ZS API Client')" = "${{ matrix.architecture }}"
          cd dist
          zip -ry "ZS-API-Client-macos-${{ matrix.artifact_suffix }}.zip" "ZS API Client.app"
          cd ..
          python scripts/generate_spdx_sbom.py --artifact "dist/ZS-API-Client-macos-${{ matrix.artifact_suffix }}.zip" --output "dist/ZS-API-Client-macos-${{ matrix.artifact_suffix }}.spdx.json"

      - name: Attest macOS package and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/ZS-API-Client-macos-${{ matrix.artifact_suffix }}.zip
          sbom-path: dist/ZS-API-Client-macos-${{ matrix.artifact_suffix }}.spdx.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.artifact_suffix }}-build
          path: |
            dist/ZS-API-Client-macos-${{ matrix.artifact_suffix }}.zip
            dist/ZS-API-Client-macos-${{ matrix.artifact_suffix }}.spdx.json

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate release checksums
        run: |
          find artifacts -type f -printf '%f\n' | sort | while read -r file; do
            find artifacts -type f -name "$file" -exec sha256sum {} \;
          done > SHA256SUMS
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/linux-build/ZS-API-Client-linux-x64.tar.gz
            artifacts/linux-build/ZS-API-Client-linux-x64.spdx.json
            artifacts/windows-build/ZS-API-Client-windows-x64-setup.exe
            artifacts/windows-build/ZS-API-Client-windows-x64-setup.spdx.json
            artifacts/macos-intel-x64-build/ZS-API-Client-macos-intel-x64.zip
            artifacts/macos-intel-x64-build/ZS-API-Client-macos-intel-x64.spdx.json
            artifacts/macos-arm64-build/ZS-API-Client-macos-arm64.zip
            artifacts/macos-arm64-build/ZS-API-Client-macos-arm64.spdx.json
            SHA256SUMS
          body: |
            ## ZS API Client ${{ github.ref_name }}
            
            ### Downloads
            
            | Platform | File |
            |----------|------|
            | 🐧 Linux (x64) | `ZS-API-Client-linux-x64.tar.gz` |
            | 🪟 Windows (x64) | `ZS-API-Client-windows-x64-setup.exe` |
            | 🍎 macOS Intel | `ZS-API-Client-macos-intel-x64.zip` |
            | 🍎 macOS Apple Silicon | `ZS-API-Client-macos-arm64.zip` |
            
            ### Installation
            
            **Linux:**
            ```bash
            tar xzf ZS-API-Client-linux-x64.tar.gz
            cd "ZS API Client"
            ./ZS\ API\ Client
            ```
            
            **Windows:**
            Run `ZS-API-Client-windows-x64-setup.exe` and follow the installer.
            
            **macOS:**
            Download the archive matching your Mac: `intel-x64` for Intel, or
            `arm64` for Apple Silicon. Extract it and move `ZS API Client.app`
            to Applications.

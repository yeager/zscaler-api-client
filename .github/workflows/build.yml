name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon0
          pip install PySide6 pyinstaller keyring
      
      - name: Build
        run: |
          python scripts/compile_translations.py
          pyinstaller --noconfirm --name "ZS API Client" --add-data "translations:translations" --add-data "data:data" --add-data "assets:assets" --add-data "CHANGELOG.md:." --hidden-import keyring.backends.SecretService zscaler_api_client.py
          cd dist
          tar czf ZS-API-Client-linux-x64.tar.gz "ZS API Client"
          cd ..
          python scripts/generate_spdx_sbom.py --artifact dist/ZS-API-Client-linux-x64.tar.gz --output dist/ZS-API-Client-linux-x64.spdx.json

      - name: Attest Linux package and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/ZS-API-Client-linux-x64.tar.gz
          sbom-path: dist/ZS-API-Client-linux-x64.spdx.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            dist/ZS-API-Client-linux-x64.tar.gz
            dist/ZS-API-Client-linux-x64.spdx.json

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install PySide6 pyinstaller keyring
      
      - name: Build
        run: |
          python scripts/compile_translations.py
          pyinstaller --noconfirm --name "ZS API Client" --add-data "translations;translations" --add-data "data;data" --add-data "assets;assets" --add-data "CHANGELOG.md;." --hidden-import keyring.backends.Windows zscaler_api_client.py
      
      - name: Create ZIP
        run: Compress-Archive -Path "dist\ZS API Client" -DestinationPath dist\ZS-API-Client-windows-x64.zip

      - name: Generate Windows SBOM
        run: python scripts/generate_spdx_sbom.py --artifact dist/ZS-API-Client-windows-x64.zip --output dist/ZS-API-Client-windows-x64.spdx.json

      - name: Attest Windows package and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/ZS-API-Client-windows-x64.zip
          sbom-path: dist/ZS-API-Client-windows-x64.spdx.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/ZS-API-Client-windows-x64.zip
            dist/ZS-API-Client-windows-x64.spdx.json

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install PySide6 pyinstaller keyring
      
      - name: Build
        run: |
          python scripts/compile_translations.py
          pyinstaller --noconfirm --windowed --name "ZS API Client" --add-data "translations:translations" --add-data "data:data" --add-data "assets:assets" --add-data "CHANGELOG.md:." --hidden-import keyring.backends.macOS zscaler_api_client.py
          cd dist
          zip -ry ZS-API-Client-macos-x64.zip "ZS API Client.app"
          cd ..
          python scripts/generate_spdx_sbom.py --artifact dist/ZS-API-Client-macos-x64.zip --output dist/ZS-API-Client-macos-x64.spdx.json

      - name: Attest macOS package and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/ZS-API-Client-macos-x64.zip
          sbom-path: dist/ZS-API-Client-macos-x64.spdx.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            dist/ZS-API-Client-macos-x64.zip
            dist/ZS-API-Client-macos-x64.spdx.json

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate release checksums
        run: |
          find artifacts -type f -printf '%f\n' | sort | while read -r file; do
            find artifacts -type f -name "$file" -exec sha256sum {} \;
          done > SHA256SUMS
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/linux-build/ZS-API-Client-linux-x64.tar.gz
            artifacts/linux-build/ZS-API-Client-linux-x64.spdx.json
            artifacts/windows-build/ZS-API-Client-windows-x64.zip
            artifacts/windows-build/ZS-API-Client-windows-x64.spdx.json
            artifacts/macos-build/ZS-API-Client-macos-x64.zip
            artifacts/macos-build/ZS-API-Client-macos-x64.spdx.json
            SHA256SUMS
          body: |
            ## ZS API Client ${{ github.ref_name }}
            
            ### Downloads
            
            | Platform | File |
            |----------|------|
            | 🐧 Linux (x64) | `ZS-API-Client-linux-x64.tar.gz` |
            | 🪟 Windows (x64) | `ZS-API-Client-windows-x64.zip` |
            | 🍎 macOS (x64) | `ZS-API-Client-macos-x64.zip` |
            
            ### Installation
            
            **Linux:**
            ```bash
            tar xzf ZS-API-Client-linux-x64.tar.gz
            cd "ZS API Client"
            ./ZS\ API\ Client
            ```
            
            **Windows:**
            Extract ZIP and run `ZS API Client\ZS API Client.exe`
            
            **macOS:**
            Extract ZIP and move `ZS API Client.app` to Applications

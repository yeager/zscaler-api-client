name: iOS source build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Generate and build iPad client
        working-directory: ios/ZSAPIClient
        run: |
          xcodegen generate
          xcodebuild -project ZSAPIClient.xcodeproj -scheme ZSAPIClient -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = [device for group in json.load(sys.stdin)["devices"].values() for device in group if device.get("isAvailable", False) and device.get("name", "").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project ZSAPIClient.xcodeproj -scheme ZSAPIClient -destination "id=$device_id" CODE_SIGNING_ALLOWED=NO test
